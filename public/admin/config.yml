site_url: https://www.data-show.com

backend:
  name: github
  repo: data-show/website
  branch: master
  # GitHub OAuth needs a proxy now that Netlify Identity/git-gateway is gone;
  # set `base_url` to the origin of the deployed proxy (e.g. a Cloudflare Worker).
  commit_messages:
    create: 'Create {{collection}} “{{slug}}”'
    update: 'Update {{collection}} “{{slug}}”'
    delete: 'Delete {{collection}} “{{slug}}”'
    uploadMedia: '[skip ci] Upload “{{path}}”'
    deleteMedia: '[skip ci] Delete “{{path}}”'

media_folder: src/assets/img
public_folder: ../../assets/img

collections:
  - name: 'authors'
    label: 'Author'
    folder: 'src/content/author'
    create: true
    slug: '{{username}}'
    fields:
      - {
          label: 'Template Key',
          name: 'templateKey',
          widget: 'hidden',
          default: 'author',
        }
      - { label: 'Name', name: 'name', widget: 'string', required: true }
      - { label: 'Image', name: 'image', widget: image, required: true }
      - {
          label: 'Description',
          name: 'description',
          widget: 'markdown',
          required: true,
        }
      - {
          label: 'Username',
          name: 'username',
          widget: 'string',
          required: true,
        }
      - {
          label: 'Github Username',
          name: 'github',
          widget: 'string',
          required: false,
        }
      - {
          label: 'Twitter Username',
          name: 'twitter',
          widget: 'string',
          required: false,
        }
      - {
          label: 'Linkedin',
          name: 'linkedin',
          widget: 'string',
          required: false,
        }
      - { label: 'Website', name: 'website', widget: 'string', required: false }

  - name: 'sources'
    label: 'Source'
    folder: 'src/content/source'
    create: true
    slug: '{{slug}}'
    fields:
      - {
          label: 'Template Key',
          name: 'templateKey',
          widget: 'hidden',
          default: 'source',
        }
      - { label: 'Title', name: 'title', widget: 'string', required: true }
      - { label: 'Image', name: 'image', widget: image, required: false }
      - {
          label: 'Description',
          name: 'description',
          widget: 'markdown',
          required: true,
        }
      - { label: 'Website', name: 'website', widget: 'string', required: true }

  - name: 'dataviz'
    label: 'Data Visualization'
    folder: 'src/content/dataviz'
    create: true
    slug: '{{slug}}'
    fields:
      - {
          label: 'Template Key',
          name: 'templateKey',
          widget: 'hidden',
          default: 'dataviz-post',
        }
      - { label: 'Title', name: 'title', widget: 'string', required: true }
      - {
          label: 'Publish Date',
          name: 'date',
          widget: 'datetime',
          required: true,
        }
      - {
          label: 'Author',
          name: 'author',
          widget: 'relation',
          collection: 'authors',
          searchFields: ['name', 'username'],
          valueField: 'username',
          displayFields: ['name', 'username'],
          required: true,
        }
      - {
          label: 'Description',
          name: 'description',
          widget: 'markdown',
          required: true,
        }
      - {
          label: 'Language',
          name: 'language',
          widget: 'list',
          options: ['en', 'fr'],
          default: ['en'],
          required: true,
        }
      - { label: 'Media', name: 'media', widget: image, required: true }
      - {
          label: 'Category',
          name: 'category',
          widget: 'relation',
          collection: 'categories',
          searchFields: ['title'],
          valueField: 'title',
          displayFields: ['title'],
          required: true,
        }
      - { label: 'Tags', name: 'tags', widget: 'list', required: false }
      - {
          label: 'Sources',
          name: 'sources',
          widget: 'list',
          default: [],
          fields:
            [
              { label: 'Link', name: 'link', widget: 'string', required: true },
              {
                label: 'Source',
                name: 'source',
                widget: 'relation',
                collection: 'sources',
                searchFields: ['title'],
                valueField: 'title',
                displayFields: ['title'],
                required: false,
              },
            ],
        }
      - {
          label: 'Notebooks',
          name: 'notebooks',
          widget: 'list',
          default: [],
          fields:
            [
              {
                label: 'Title',
                name: 'title',
                widget: 'string',
                required: true,
              },
              { label: 'Link', name: 'link', widget: 'string', required: true },
            ],
        }

  - name: 'categories'
    label: 'Category'
    folder: 'src/content/category'
    create: true
    slug: '{{slug}}'
    fields:
      - {
          label: 'Template Key',
          name: 'templateKey',
          widget: 'hidden',
          default: 'category',
        }
      - { label: 'Title', name: 'title', widget: 'string', required: true }
      - {
          label: 'Description',
          name: 'description',
          widget: 'markdown',
          required: true,
        }

  - name: 'posts'
    label: 'Blog Post'
    folder: 'src/content/blog'
    create: true
    slug: '{{slug}}'
    fields:
      - {
          label: 'Template Key',
          name: 'templateKey',
          widget: 'hidden',
          default: 'blog-post',
        }
      - {
          label: 'Canonical',
          name: 'canonical',
          widget: 'string',
          required: false,
        }
      - { label: 'Title', name: 'title', widget: 'string', required: true }
      - {
          label: 'Publish Date',
          name: 'date',
          widget: 'datetime',
          required: true,
        }
      - {
          label: 'Author',
          name: 'author',
          widget: 'relation',
          collection: 'authors',
          searchFields: ['name', 'username'],
          valueField: 'username',
          displayFields: ['name', 'username'],
          required: true,
        }
      - {
          label: 'Description',
          name: 'description',
          widget: 'text',
          required: true,
        }
      - {
          label: 'Language',
          name: 'language',
          widget: 'list',
          options: ['en', 'fr'],
          default: ['en'],
          required: true,
        }
      - {
          label: 'Featured Image',
          name: 'featuredimage',
          widget: image,
          required: true,
        }
      - {
          label: 'Featured Post',
          name: 'featuredpost',
          widget: 'boolean',
          required: false,
        }
      - { label: 'Body', name: 'body', widget: 'markdown', required: true }
      - {
          label: 'Category',
          name: 'category',
          widget: 'relation',
          collection: 'categories',
          searchFields: ['title'],
          valueField: 'title',
          displayFields: ['title'],
          required: true,
        }
      - { label: 'Tags', name: 'tags', widget: 'list', required: false }
      - {
          label: 'Sources',
          name: 'sources',
          widget: 'list',
          default: [],
          fields:
            [
              { label: 'Link', name: 'link', widget: 'string', required: true },
              {
                label: 'Source',
                name: 'source',
                widget: 'relation',
                collection: 'sources',
                searchFields: ['title'],
                valueField: 'title',
                displayFields: ['title'],
                required: false,
              },
            ],
        }
      - {
          label: 'Notebooks',
          name: 'notebooks',
          widget: 'list',
          default: [],
          fields:
            [
              {
                label: 'Title',
                name: 'title',
                widget: 'string',
                required: true,
              },
              { label: 'Link', name: 'link', widget: 'string', required: true },
            ],
        }
